<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Web Layout</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        .container{
            display:grid;
            grid-template-columns: 450px 1fr;
            grid-template-rows: 120px 1fr 100px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            height:100vh;
        }
        .header{
            grid-area:header;
            background:#2d2d2d;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            font-weight:bold;
        }
        .sidebar{
            grid-area:sidebar;
            background:#e9e9e9;
            padding:30px;
        }
        .sidebar h2{
            margin-bottom:20px;
            font-size:35px;
        }
        .sidebar p{
            font-size:22px;
            line-height:1.6;
        }
        .main{
            grid-area:main;
            background:white;
            padding:30px;
        }
        .main h2{
            margin-bottom:20px;
            font-size:35px;
        }
        .main p{
            font-size:22px;
            line-height:1.6;
        }
        .footer{
            grid-area:footer;
            background:#2d2d2d;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            font-weight:bold;
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">
            <h2>Sidebar</h2>
            <p>The Menu or quick access content.</p>
        </div>
        <div class="main">
            <h2>Main Content</h2>
            <p>The core website content should be displayed here.</p>
        </div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>

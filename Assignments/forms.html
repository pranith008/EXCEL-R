<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Controls</title>
</head>
<body>
    <h1>Form Input Controls Example</h1>
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password">
    <label for="email">Email:</label><br>
    <input type="email" id="email" placeholder="Enter your email">
    <label for="age">Age:</label>
    <input type="number" id="age" value="18" style="width: 50px;">
    <label for="rating" >Rating:</label>
    <input type="range" style="accent-color: blue;">
    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" value="2000-01-01">
    <label for="time">Time:</label>
    <input type="time" value="12:00">
    <label for="image">Image:</label>
    <img src="https://dummyimage.com/150x50/cfcfcf/000000&text=150x50"><br><br>
    <label for="week">Week:</label>
    <input type="week" ><br><br>
    <label for="month">Month:</label>
    <input type="month"><br><br>
    <label for="datetime-local">Datetime-Local:</label>
    <input type="datetime-local"><br><br>
    <label for="url">URL:</label>
    <input type="url" id="url"><br><br>
    <label for="search">Search:</label>
    <input type="search"><br><br>
    <label for="Gender">Gender:</label><br><br>
    <input type="radio" value="Male" checked style="accent-color: blue;">Male 
    <input type="radio" value="female">Female <br><br>
    <label for="intrests">Intrests:</label><br><br>
    <input type="checkbox" value="reading">Reading
    <input type="checkbox" value="sports" checked style="accent-color: blue;">sports
    <label for="country">Country:</label>
    <select name="country" id="country">
        <option value="united states" selected>United States</option>
        <option value="india">India</option>
        <option value="australia">Australia</option>
    </select>
    <label for="message">Message:</label><br>
    <textarea name="message" id="message" rows="3" cols="50"></textarea>
    <button type="submit">Submit</button>
</body>
</html>
